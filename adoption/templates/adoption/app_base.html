{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Pet Adoption System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="{% static 'styles.css' %}" rel="stylesheet" />
  </head>
  <body class="bg-soft">
    <div class="d-flex">
      <!-- Sidebar -->
      <nav class="app-sidebar">
        <div class="sidebar-header">
          <a href="{% url 'dashboard' %}" class="sidebar-logo">
            <i class="bi bi-hearts"></i>
            <span>Pet Care</span>
          </a>
        </div>

        <ul class="nav flex-column sidebar-nav">
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
              <i class="bi bi-house-door me-2"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'pet_list' %}active{% endif %}" href="{% url 'pet_list' %}">
              <i class="bi bi-paw me-2"></i>Pets
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'pet_create' %}active{% endif %}" href="{% url 'pet_create' %}">
              <i class="bi bi-plus-circle me-2"></i>Add Pet
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'about_us' %}active{% endif %}" href="{% url 'about_us' %}">
              <i class="bi bi-info-circle me-2"></i>About Us
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}" href="{% url 'settings' %}">
              <i class="bi bi-gear me-2"></i>Settings
            </a>
          </li>
        </ul>

        <div class="sidebar-footer">
          <a href="{% url 'logout' %}" class="btn btn-outline-light w-100">
            <i class="bi bi-box-arrow-right me-2"></i>Logout
          </a>
        </div>
      </nav>

      <!-- Main Content -->
      <div class="app-content">
        <!-- Top Bar -->
        <header class="app-header">
          <div class="d-flex justify-content-between align-items-center">
            <h1 class="app-title mb-0">{{ page_title|default:"Dashboard" }}</h1>
            <div class="user-info">
              <span class="me-3"><i class="bi bi-person-circle me-1"></i>{{ request.user.username }}</span>
              <span class="text-muted small">Today</span>
            </div>
          </div>
        </header>

        <!-- Content Area -->
        <main class="app-main">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
